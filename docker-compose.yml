services:
  pimon:
    build: ./app
    container_name: pimon
    restart: unless-stopped
    network_mode: host
    # Leave time for the shutdown backup in entrypoint.sh.
    stop_grace_period: 30s
    environment: [TZ=Europe/Stockholm]
    tmpfs: [/opt/pimon/db:size=20m, /var/www/html/pimon:size=20m]
    volumes:
      - ./data:/opt/pimon/backups
      - /:/hostfs:ro
      - ./data/archive:/opt/pimon/archive
    healthcheck:
      # status.json is rewritten every minute; fail if it is older than 5.
      test: ["CMD-SHELL", "test -n \"$(find /var/www/html/pimon/status.json -mmin -5 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
