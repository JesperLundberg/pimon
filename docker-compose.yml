services:
  pimon:
    build: ./app
    container_name: pimon
    restart: unless-stopped
    network_mode: host
    # Leave time for the shutdown backup in entrypoint.sh.
    stop_grace_period: 30s
    environment: [TZ=Europe/Stockholm]
    tmpfs: [/opt/pimon/db:size=20m]
    volumes:
      - pimon-www:/var/www/html/pimon
      - ./data:/opt/pimon/backups
      - /:/hostfs:ro
      - ./data/archive:/opt/pimon/archive
    healthcheck:
      # status.json is rewritten every minute; fail if it is older than 5.
      test: ["CMD-SHELL", "test -n \"$(find /var/www/html/pimon/status.json -mmin -5 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  web:
    build: ./web
    container_name: pimon_web
    restart: unless-stopped
    ports: [8088:80]
    volumes: [pimon-www:/usr/share/nginx/html/pimon:ro]
    depends_on: [pimon]

volumes:
  pimon-www:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=20m
